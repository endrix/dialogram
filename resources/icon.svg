<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#4F46E5"/>
            <stop offset="1" stop-color="#7C3AED"/>
        </linearGradient>
    </defs>
    <!-- rounded-square badge -->
    <rect x="0" y="0" width="256" height="256" rx="58" fill="url(#bg)"/>
    <!-- speech bubble with tail -->
    <path d="M74 52
             h108
             a30 30 0 0 1 30 30
             v58
             a30 30 0 0 1 -30 30
             h-66
             l-46 36
             q-6 5 -6 -4
             v-32
             a30 30 0 0 1 -20 -28.3
             v-59.7
             a30 30 0 0 1 30 -30
             z"
          fill="#ffffff"/>
    <!-- mini dataflow graph inside the bubble -->
    <g stroke="#4F46E5" stroke-width="11" stroke-linecap="round">
        <line x1="88" y1="112" x2="148" y2="86"/>
        <line x1="88" y1="112" x2="166" y2="138"/>
        <line x1="148" y1="86" x2="166" y2="138"/>
    </g>
    <circle cx="88" cy="112" r="15" fill="#4F46E5"/>
    <circle cx="148" cy="86" r="15" fill="#7C3AED"/>
    <circle cx="166" cy="138" r="15" fill="#4F46E5"/>
</svg>
